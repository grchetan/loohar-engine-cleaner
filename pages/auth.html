<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Register — Lohar Auto Garage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <style>
    /* Custom Premium Dark Theme for Auth Page */
    body {
      background: #0c0b0a !important; /* Premium rich charcoal black */
      color: #fcfbf9 !important;
    }

    /* Glassmorphic Dark Card */
    .auth-card.glass-card {
      background: rgba(27, 26, 23, 0.7) !important;
      backdrop-filter: blur(25px) !important;
      -webkit-backdrop-filter: blur(25px) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5) !important;
    }

    /* Navbar on Dark Theme */
    .navbar.scrolled {
      background: rgba(12, 11, 10, 0.8) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
    }
    .nav-logo {
      color: #fcfbf9 !important;
    }

    /* Titles and Subtitles */
    .auth-title {
      color: #fcfbf9 !important;
    }
    .auth-subtitle {
      color: rgba(252, 251, 249, 0.6) !important;
    }

    /* Tab Switcher */
    .auth-tabs {
      background: rgba(255, 255, 255, 0.05) !important;
    }
    .auth-tab {
      color: rgba(252, 251, 249, 0.5) !important;
    }
    .auth-tab.active {
      background: var(--yellow) !important;
      color: #1b1a17 !important;
    }

    /* Labels and Inputs */
    .form-group label {
      color: rgba(252, 251, 249, 0.8) !important;
    }
    .form-group input {
      background: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #fcfbf9 !important;
    }
    .form-group input:focus {
      border-color: var(--yellow) !important;
      background: rgba(245, 197, 24, 0.05) !important;
      box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.15) !important;
    }
    .form-group input::placeholder {
      color: rgba(252, 251, 249, 0.3) !important;
    }

    /* Password Toggle and Dividers */
    .form-group button[onclick^="togglePwd"] {
      color: rgba(252, 251, 249, 0.6) !important;
    }
    .auth-divider {
      color: rgba(252, 251, 249, 0.4) !important;
    }
    .auth-divider::before,
    .auth-divider::after {
      background: rgba(255, 255, 255, 0.1) !important;
    }

    /* Google Button */
    .google-btn {
      background: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #fcfbf9 !important;
    }
    .google-btn:hover {
      background: rgba(255, 255, 255, 0.07) !important;
      border-color: rgba(255, 255, 255, 0.2) !important;
      transform: translateY(-2px) !important;
    }

    /* Reset Link Back Arrow */
    #forgotPanel a {
      color: var(--yellow) !important;
    }
  </style>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;">

  <nav class="navbar scrolled" style="position:relative">
    <div class="nav-container">
      <a href="/" class="nav-logo"><img src="../assets/images/logo.png" alt="Lohar Auto Logo" class="logo-img" /></a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card glass-card">
      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" id="registerTab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <div id="loginPanel">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your Lohar Auto account</p>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="your@email.com" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <div style="position:relative">
              <input type="password" id="loginPassword" placeholder="Your password" required />
              <button type="button" onclick="togglePwd('loginPassword', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(18,18,18,0.5);cursor:pointer;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Show</button>
            </div>
          </div>
          <div style="text-align:right;margin-bottom:16px">
            <a href="#" onclick="showForgotPassword()" style="font-size:0.85rem;color:#f5c518;text-decoration:none">Forgot Password?</a>
          </div>
          <button type="submit" class="btn-primary btn-full" id="loginBtn" style="padding:14px; font-weight:800;">Login</button>
        </form>
        <div class="auth-divider"><span>OR</span></div>
        <button class="google-btn" onclick="handleGoogleLogin()" id="googleBtn" style="padding:14px; font-weight:800;">
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92(3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
      </div>

      <!-- Register Form -->
      <div id="registerPanel" style="display:none">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join thousands of satisfied customers</p>
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="regName" placeholder="Your full name" required />
          </div>
          <div class="form-group">
            <label>Email Address *</label>
            <input type="email" id="regEmail" placeholder="your@email.com" required />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="regPhone" placeholder="+91 XXXXX XXXXX" />
          </div>
          <div class="form-group">
            <label>Password *</label>
            <div style="position:relative">
              <input type="password" id="regPassword" placeholder="Minimum 6 characters" required minlength="6" />
              <button type="button" onclick="togglePwd('regPassword', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(18,18,18,0.5);cursor:pointer;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Show</button>
            </div>
          </div>
          <button type="submit" class="btn-primary btn-full" id="registerBtn" style="padding:14px; font-weight:800;">Create Account</button>
        </form>
        <div class="auth-divider"><span>OR</span></div>
        <button class="google-btn" onclick="handleGoogleLogin()" style="padding:14px; font-weight:800;">
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92(3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
      </div>

      <!-- Forgot Password Panel -->
      <div id="forgotPanel" style="display:none">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your email to receive a reset link</p>
        <form id="forgotForm" onsubmit="handleForgotPassword(event)">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="forgotEmail" placeholder="your@email.com" required />
          </div>
          <button type="submit" class="btn-primary btn-full" style="padding:14px; font-weight:800;">Send Reset Link</button>
        </form>
        <div style="text-align:center;margin-top:16px">
          <a href="#" onclick="showPanel('loginPanel')" style="color:#f5c518;font-size:0.88rem">← Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (window.isLoggedIn && isLoggedIn()) {
      const redirect = new URLSearchParams(location.search).get('redirect') || '/';
      window.location.href = redirect;
    }

    function switchTab(tab) {
      document.getElementById('loginPanel').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerPanel').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('forgotPanel').style.display = 'none';
      document.getElementById('loginTab').classList.toggle('active', tab === 'login');
      document.getElementById('registerTab').classList.toggle('active', tab === 'register');
    }

    function showPanel(panelId) {
      ['loginPanel','registerPanel','forgotPanel'].forEach(id => {
        document.getElementById(id).style.display = id === panelId ? 'block' : 'none';
      });
    }

    function showForgotPassword() { showPanel('forgotPanel'); }

    function togglePwd(inputId, btn) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? 'Show' : 'Hide';
    }

    function setLoading(btnId, loading, text = 'Loading...') {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      btn.disabled = loading;
      btn.innerHTML = loading ? text : btn.getAttribute('data-original') || btn.innerHTML;
      if (!loading) btn.removeAttribute('data-original');
      else btn.setAttribute('data-original', btn.innerHTML);
    }

    async function handleLogin(e) {
      e.preventDefault();
      setLoading('loginBtn', true, 'Logging in...');
      try {
        await loginUser(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
        const redirect = new URLSearchParams(location.search).get('redirect') || '/';
        setTimeout(() => window.location.href = redirect, 1000);
      } catch (_) {
      } finally {
        setLoading('loginBtn', false);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      setLoading('registerBtn', true, 'Creating account...');
      try {
        await registerUser(
          document.getElementById('regName').value,
          document.getElementById('regEmail').value,
          document.getElementById('regPassword').value,
          document.getElementById('regPhone').value
        );
        const redirect = new URLSearchParams(location.search).get('redirect') || '/';
        setTimeout(() => window.location.href = redirect, 1000);
      } catch (_) {
      } finally {
        setLoading('registerBtn', false);
      }
    }

    async function handleGoogleLogin() {
      try {
        await signInWithGoogle();
        const redirect = new URLSearchParams(location.search).get('redirect') || '/';
        setTimeout(() => window.location.href = redirect, 1000);
      } catch (_) {}
    }

    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value;
      try {
        await AuthAPI.forgotPassword(email);
        toast.success('Reset link sent! Check your email.');
        setTimeout(() => showPanel('loginPanel'), 2000);
      } catch (err) {
        toast.error(err.message);
      }
    }
  </script>
</body>
</html>
