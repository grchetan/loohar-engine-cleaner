<body class="bg-dark">

  <!-- ======= NAVBAR ======= -->
  <nav id="navbar" class="navbar scrolled">
    <div class="nav-container">
      <a href="/" class="nav-logo"><img src="../assets/images/logo.png" alt="Lohar Auto Logo" class="logo-img" /></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/" class="nav-link">Home</a></li>

      <div class="container">
        <p>© <span class="current-year">2026</span> Lohar Auto Garage. All Rights Reserved.</p>

    </div>
