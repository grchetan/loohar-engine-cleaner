<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Coupons — Lohar Auto Garage</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../css/pages.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <meta name="robots" content="noindex,nofollow" />
</head>
<body>
  <nav class="navbar scrolled" style="position:sticky;top:0;z-index:1000">
    <div class="nav-container">
      <a href="/" class="nav-logo"><span class="logo-icon">⚙</span><span class="logo-text">LOHAR <span class="logo-accent">ADMIN</span></span></a>
      <div style="margin-left:auto;display:flex;gap:12px;align-items:center">
        <span id="adminName" style="color:var(--white-3);font-size:0.88rem"></span>
        <a href="/" class="btn-outline btn-sm">View Site</a>
        <button onclick="logoutUser()" class="btn-secondary btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="index.html" class="admin-nav-link"><span class="icon">📊</span> Dashboard</a>
      <a href="products.html" class="admin-nav-link"><span class="icon">📦</span> Products</a>
      <a href="orders.html" class="admin-nav-link"><span class="icon">🛒</span> Orders</a>
      <a href="customers.html" class="admin-nav-link"><span class="icon">👥</span> Customers</a>
      <a href="coupons.html" class="admin-nav-link active"><span class="icon">🎫</span> Coupons</a>
      <a href="dealers.html" class="admin-nav-link"><span class="icon">🤝</span> Dealer Inquiries</a>
      <a href="reviews.html" class="admin-nav-link"><span class="icon">⭐</span> Reviews</a>
    </aside>

    <main class="admin-main">
      <div class="admin-page-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <div class="admin-page-title" style="margin-bottom:0">Promo Coupons</div>
        <button onclick="openCouponModal()" class="btn-primary btn-sm">🎫 Add Coupon</button>
      </div>

      <div class="glass-card" style="padding:24px;">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Coupon Code</th>
                <th>Description</th>
                <th>Type</th>
                <th>Discount Value</th>
                <th>Min. Order</th>
                <th>Usage Limit</th>
                <th>Used Count</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="couponsTableBody">
              <tr><td colspan="9" style="text-align:center; color:var(--white-3)">Loading coupons...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Coupon Modal -->
      <div id="couponModal" class="modal-overlay" style="display:none">
        <div class="modal-content glass-card" style="width:500px; max-width:95vw; padding:28px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
            <h3 style="color:var(--white); font-family:Outfit; margin:0" id="modalTitle">Add Coupon</h3>
            <button onclick="closeCouponModal()" style="background:none; border:none; color:var(--white-3); font-size:1.8rem; cursor:pointer">&times;</button>
          </div>

          <form id="couponForm" onsubmit="saveCoupon(event)">
            <input type="hidden" id="editCouponId">

            <div class="form-group">
              <label>Coupon Code *</label>
              <input type="text" id="coupCode" required placeholder="e.g. WELCOME10" style="text-transform:uppercase">
            </div>

            <div class="form-group">
              <label>Description</label>
              <input type="text" id="coupDesc" placeholder="e.g. 10% off for new customers">
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
              <div class="form-group">
                <label>Discount Type *</label>
                <select id="coupType" required>
                  <option value="percent">Percentage (%)</option>
                  <option value="flat">Flat Price (₹)</option>
                </select>
              </div>
              <div class="form-group">
                <label>Discount Value *</label>
                <input type="number" id="coupVal" required min="1" placeholder="Value">
              </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
              <div class="form-group">
                <label>Min. Order Amount (₹)</label>
                <input type="number" id="coupMin" min="0" placeholder="0">
              </div>
              <div class="form-group">
                <label>Usage Limit (Max Uses)</label>
                <input type="number" id="coupLimit" min="1" placeholder="Unlimited">
              </div>
            </div>

            <div class="form-group">
              <label>Expiration Date</label>
              <input type="date" id="coupExpiry">
            </div>

            <div class="form-group" style="display:flex; align-items:center; gap:8px">
              <input type="checkbox" id="coupActive" style="width:auto; margin:0; accent-color:#f5c518" checked>
              <label for="coupActive" style="margin:0; font-size:0.85rem">Active & Redeemable</label>
            </div>

            <button type="submit" id="saveCoupBtn" class="btn-primary btn-full" style="margin-top:24px; padding:12px">⚡ Save Coupon</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    let couponsList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!isLoggedIn()) return window.location.href = '/pages/auth.html?redirect=/pages/admin/coupons.html';
      try {
        const { user } = await AuthAPI.me();
        if (user.role !== 'admin') { window.location.href = '/'; return; }
        document.getElementById('adminName').textContent = user.name;
        loadAdminCoupons();
      } catch (err) {
        clearToken();
        clearUser();
        window.location.href = '/pages/auth.html?redirect=/pages/admin/coupons.html';
      }
    });

    async function loadAdminCoupons() {
      try {
        const res = await CouponsAPI.list();
        couponsList = res.coupons || [];

        const tbody = document.getElementById('couponsTableBody');
        if (couponsList.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:var(--white-3)">No coupons created</td></tr>';
          return;
        }

        tbody.innerHTML = couponsList.map(c => `
          <tr>
            <td><strong style="color:var(--yellow)">${c.code}</strong></td>
            <td>${c.description || '-'}</td>
            <td>${c.discountType.toUpperCase()}</td>
            <td>${c.discountType === 'percent' ? c.value + '%' : '₹' + c.value}</td>
            <td>₹${c.minOrderAmount || 0}</td>
            <td>${c.maxUses || 'Unlimited'}</td>
            <td>${c.usedCount}</td>
            <td>
              <span style="font-weight:700; color:${c.isActive ? '#10b981' : '#ef4444'}">
                ${c.isActive ? '● Active' : '● Inactive'}
              </span>
            </td>
            <td>
              <div style="display:flex; gap:8px">
                <button onclick="editCoupon('${c._id}')" class="action-btn action-view" style="background:#f5c518; color:#000">Edit</button>
                <button onclick="deleteCoupon('${c._id}')" class="action-btn" style="background:#ef4444; color:#fff">Delete</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) { toast.error('Failed to load coupons'); }
    }

    function openCouponModal() {
      document.getElementById('editCouponId').value = '';
      document.getElementById('couponForm').reset();
      document.getElementById('modalTitle').textContent = 'Create New Coupon';
      document.getElementById('coupCode').readOnly = false;
      document.getElementById('couponModal').style.display = 'flex';
    }

    function closeCouponModal() {
      document.getElementById('couponModal').style.display = 'none';
    }

    async function editCoupon(id) {
      const c = couponsList.find(item => item._id === id);
      if (!c) return;

      document.getElementById('editCouponId').value = c._id;
      document.getElementById('coupCode').value = c.code;
      document.getElementById('coupCode').readOnly = true;
      document.getElementById('coupDesc').value = c.description || '';
      document.getElementById('coupType').value = c.discountType;
      document.getElementById('coupVal').value = c.value;
      document.getElementById('coupMin').value = c.minOrderAmount || 0;
      document.getElementById('coupLimit').value = c.maxUses || '';
      document.getElementById('coupExpiry').value = c.expiresAt ? c.expiresAt.split('T')[0] : '';
      document.getElementById('coupActive').checked = !!c.isActive;

      document.getElementById('modalTitle').textContent = 'Edit Coupon';
      document.getElementById('couponModal').style.display = 'flex';
    }

    async function saveCoupon(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveCoupBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      const data = {
        code: document.getElementById('coupCode').value.trim().toUpperCase(),
        description: document.getElementById('coupDesc').value.trim(),
        discountType: document.getElementById('coupType').value,
        value: parseFloat(document.getElementById('coupVal').value),
        minOrderAmount: parseFloat(document.getElementById('coupMin').value || 0),
        isActive: document.getElementById('coupActive').checked
      };

      const limitVal = document.getElementById('coupLimit').value;
      data.maxUses = limitVal ? parseInt(limitVal) : null;

      const expiryVal = document.getElementById('coupExpiry').value;
      data.expiresAt = expiryVal ? new Date(expiryVal) : null;

      try {
        const id = document.getElementById('editCouponId').value;
        if (id) {
          await CouponsAPI.update(id, data);
          toast.success('Coupon updated successfully!');
        } else {
          await CouponsAPI.create(data);
          toast.success('Coupon added successfully!');
        }

        closeCouponModal();
        loadAdminCoupons();
      } catch (err) {
        toast.error(err.message || 'Failed to save coupon');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '⚡ Save Coupon';
      }
    }

    async function deleteCoupon(id) {
      if (!confirm('Are you sure you want to remove this coupon?')) return;
      try {
        await CouponsAPI.delete(id);
        toast.info('Coupon removed');
        loadAdminCoupons();
      } catch (err) { toast.error('Failed to delete coupon'); }
    }
  </script>
</body>
</html>
