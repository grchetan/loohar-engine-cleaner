<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Products — Lohar Auto Garage</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../css/pages.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <meta name="robots" content="noindex,nofollow" />
</head>
<body>
  <nav class="navbar scrolled" style="position:sticky;top:0;z-index:1000">
    <div class="nav-container">
      <a href="/" class="nav-logo"><span class="logo-icon">⚙</span><span class="logo-text">LOHAR <span class="logo-accent">ADMIN</span></span></a>
      <div style="margin-left:auto;display:flex;gap:12px;align-items:center">
        <span id="adminName" style="color:var(--white-3);font-size:0.88rem"></span>
        <a href="/" class="btn-outline btn-sm">View Site</a>
        <button onclick="logoutUser()" class="btn-secondary btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="index.html" class="admin-nav-link"><span class="icon">📊</span> Dashboard</a>
      <a href="products.html" class="admin-nav-link active"><span class="icon">📦</span> Products</a>
      <a href="orders.html" class="admin-nav-link"><span class="icon">🛒</span> Orders</a>
      <a href="customers.html" class="admin-nav-link"><span class="icon">👥</span> Customers</a>
      <a href="coupons.html" class="admin-nav-link"><span class="icon">🎫</span> Coupons</a>
      <a href="dealers.html" class="admin-nav-link"><span class="icon">🤝</span> Dealer Inquiries</a>
      <a href="reviews.html" class="admin-nav-link"><span class="icon">⭐</span> Reviews</a>
    </aside>

    <main class="admin-main">
      <div class="admin-page-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <div class="admin-page-title" style="margin-bottom:0">Product Inventory</div>
        <button onclick="openProductModal()" class="btn-primary btn-sm">➕ Add Product</button>
      </div>

      <div class="glass-card" style="padding:24px;">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>MRP</th>
                <th>Stock</th>
                <th>SKU</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="productsTableBody">
              <tr><td colspan="8" style="text-align:center; color:var(--white-3)">Loading products...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Product Modal (Create / Edit) -->
      <div id="productModal" class="modal-overlay" style="display:none">
        <div class="modal-content glass-card" style="width:650px; max-width:95vw; max-height:90vh; overflow-y:auto; padding:28px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
            <h3 style="color:var(--white); font-family:Outfit; margin:0" id="modalTitle">Add Product</h3>
            <button onclick="closeProductModal()" style="background:none; border:none; color:var(--white-3); font-size:1.8rem; cursor:pointer">&times;</button>
          </div>

          <form id="productForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="editProductId">

            <div class="form-group">
              <label>Product Name *</label>
              <input type="text" id="prodName" required placeholder="e.g. Lohar Heavy Degreaser">
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
              <div class="form-group">
                <label>Category *</label>
                <select id="prodCategory" required>
                  <option value="Engine Care">Engine Care</option>
                  <option value="Exterior Care">Exterior Care</option>
                  <option value="Interior Care">Interior Care</option>
                  <option value="Garage Maintenance">Garage Maintenance</option>
                </select>
              </div>
              <div class="form-group">
                <label>SKU (Stock Keeping Unit)</label>
                <input type="text" id="prodSku" placeholder="LAG-ED-001">
              </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px">
              <div class="form-group">
                <label>Price (₹) *</label>
                <input type="number" id="prodPrice" required min="0" placeholder="Selling Price">
              </div>
              <div class="form-group">
                <label>MRP (₹)</label>
                <input type="number" id="prodMrp" min="0" placeholder="List Price">
              </div>
              <div class="form-group">
                <label>Stock Level *</label>
                <input type="number" id="prodStock" required min="0" placeholder="Quantity Available">
              </div>
            </div>

            <div class="form-group">
              <label>Description *</label>
              <textarea id="prodDesc" rows="3" required placeholder="Describe features, performance, formula..."></textarea>
            </div>

            <div class="form-group">
              <label>How to Use</label>
              <textarea id="prodHowToUse" rows="2" placeholder="Instructions..."></textarea>
            </div>

            <div class="form-group">
              <label>Key Features (One feature per line)</label>
              <textarea id="prodFeatures" rows="3" placeholder="e.g. Removes heavy grease&#10;Works in 3 minutes&#10;Safer on metal"></textarea>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
              <div class="form-group">
                <label>Weight (kg)</label>
                <input type="number" step="0.1" id="prodWeight" placeholder="0.5">
              </div>
              <div class="form-group">
                <label>HSN Code</label>
                <input type="text" id="prodHsn" placeholder="3402">
              </div>
            </div>

            <div class="form-group">
              <label>Product Images</label>
              <input type="file" id="prodImages" multiple accept="image/*" style="padding:10px 0; background:none; border:none;">
              <small style="color:var(--white-3)">Select up to 5 image files. Leave blank to retain existing ones.</small>
            </div>

            <div style="display:flex; justify-content:space-between; margin-top:20px">
              <div class="form-group" style="display:flex; align-items:center; gap:8px; margin-bottom:0">
                <input type="checkbox" id="prodFeatured" style="width:auto; margin:0; accent-color:#f5c518">
                <label for="prodFeatured" style="margin:0; font-size:0.85rem">Featured Product</label>
              </div>
              <div class="form-group" style="display:flex; align-items:center; gap:8px; margin-bottom:0">
                <input type="checkbox" id="prodBestseller" style="width:auto; margin:0; accent-color:#f5c518">
                <label for="prodBestseller" style="margin:0; font-size:0.85rem">Best Seller</label>
              </div>
            </div>

            <button type="submit" id="saveProdBtn" class="btn-primary btn-full" style="margin-top:24px; padding:12px">⚡ Save Product</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    let productsList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!isLoggedIn()) return window.location.href = '/pages/auth.html?redirect=/pages/admin/products.html';
      try {
        const { user } = await AuthAPI.me();
        if (user.role !== 'admin') { window.location.href = '/'; return; }
        document.getElementById('adminName').textContent = user.name;
        loadAdminProducts();
      } catch (err) {
        clearToken();
        clearUser();
        window.location.href = '/pages/auth.html?redirect=/pages/admin/products.html';
      }
    });

    async function loadAdminProducts() {
      try {
        // Fetch all products (limit 100)
        const res = await ProductsAPI.list({ limit: 100 });
        productsList = res.products || [];

        const tbody = document.getElementById('productsTableBody');
        if (productsList.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:var(--white-3)">No products in inventory</td></tr>';
          return;
        }

        tbody.innerHTML = productsList.map(p => `
          <tr>
            <td><img src="${p.images?.[0] || '/assets/images/hero_bottle.png'}" style="width:40px; height:40px; object-fit:contain; border-radius:4px" onerror="this.src='/assets/images/hero_bottle.png'"></td>
            <td><strong>${p.name}</strong></td>
            <td>${p.category}</td>
            <td>₹${p.price}</td>
            <td>₹${p.mrp || p.price}</td>
            <td>
              <div style="display:flex; align-items:center; gap:8px">
                <input type="number" value="${p.stock}" style="width:70px; padding:4px 8px; margin:0; text-align:center" onchange="quickUpdateStock('${p._id}', this.value)">
              </div>
            </td>
            <td>${p.sku || '-'}</td>
            <td>
              <div style="display:flex; gap:8px">
                <button onclick="editProduct('${p._id}')" class="action-btn action-view" style="background:#f5c518; color:#000">Edit</button>
                <button onclick="deleteProduct('${p._id}')" class="action-btn" style="background:#ef4444; color:#fff">Delete</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) { toast.error('Failed to load products'); }
    }

    async function quickUpdateStock(id, val) {
      try {
        await ProductsAPI.updateStock(id, parseInt(val));
        toast.success('Stock level updated successfully');
      } catch (err) { toast.error(err.message || 'Failed to update stock'); }
    }

    function openProductModal() {
      document.getElementById('editProductId').value = '';
      document.getElementById('productForm').reset();
      document.getElementById('modalTitle').textContent = 'Add New Product';
      document.getElementById('productModal').style.display = 'flex';
    }

    function closeProductModal() {
      document.getElementById('productModal').style.display = 'none';
    }

    async function editProduct(id) {
      const p = productsList.find(item => item._id === id);
      if (!p) return;

      document.getElementById('editProductId').value = p._id;
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodCategory').value = p.category;
      document.getElementById('prodSku').value = p.sku || '';
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodMrp').value = p.mrp || '';
      document.getElementById('prodStock').value = p.stock;
      document.getElementById('prodDesc').value = p.description;
      document.getElementById('prodHowToUse').value = p.howToUse || '';
      document.getElementById('prodFeatures').value = (p.features || []).join('\n');
      document.getElementById('prodWeight').value = p.weight || '';
      document.getElementById('prodHsn').value = p.hsn || '';
      document.getElementById('prodFeatured').checked = !!p.isFeatured;
      document.getElementById('prodBestseller').checked = !!p.isBestseller;

      document.getElementById('modalTitle').textContent = 'Edit Product';
      document.getElementById('productModal').style.display = 'flex';
    }

    async function saveProduct(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveProdBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        const id = document.getElementById('editProductId').value;
        const form = document.getElementById('productForm');
        
        // Assemble FormData for multipart image uploads
        const formData = new FormData();
        formData.append('name', document.getElementById('prodName').value.trim());
        formData.append('category', document.getElementById('prodCategory').value);
        formData.append('sku', document.getElementById('prodSku').value.trim());
        formData.append('price', parseFloat(document.getElementById('prodPrice').value));
        
        const mrpVal = document.getElementById('prodMrp').value;
        if (mrpVal) formData.append('mrp', parseFloat(mrpVal));
        
        formData.append('stock', parseInt(document.getElementById('prodStock').value));
        formData.append('description', document.getElementById('prodDesc').value.trim());
        formData.append('howToUse', document.getElementById('prodHowToUse').value.trim());
        formData.append('features', document.getElementById('prodFeatures').value.trim());
        
        const weightVal = document.getElementById('prodWeight').value;
        if (weightVal) formData.append('weight', parseFloat(weightVal));
        
        formData.append('hsn', document.getElementById('prodHsn').value.trim());
        formData.append('isFeatured', document.getElementById('prodFeatured').checked);
        formData.append('isBestseller', document.getElementById('prodBestseller').checked);

        // Images files
        const fileInput = document.getElementById('prodImages');
        if (fileInput.files.length > 0) {
          for (let i = 0; i < fileInput.files.length; i++) {
            formData.append('images', fileInput.files[i]);
          }
        }

        if (id) {
          // If editing and didn't upload files, send existing images
          const p = productsList.find(item => item._id === id);
          if (p && p.images) {
            formData.append('keepImages', p.images.join(','));
          }
          await ProductsAPI.update(id, formData);
          toast.success('Product updated successfully!');
        } else {
          await ProductsAPI.create(formData);
          toast.success('Product added successfully!');
        }

        closeProductModal();
        loadAdminProducts();
      } catch (err) {
        toast.error(err.message || 'Failed to save product');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '⚡ Save Product';
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Are you sure you want to remove this product?')) return;
      try {
        await ProductsAPI.delete(id);
        toast.info('Product removed from store');
        loadAdminProducts();
      } catch (err) { toast.error('Failed to delete product'); }
    }
  </script>
</body>
</html>
