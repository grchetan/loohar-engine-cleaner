<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Orders — Lohar Auto Garage</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../css/pages.css" />
  <meta name="robots" content="noindex,nofollow" />
</head>
<body>
  <nav class="navbar scrolled" style="position:sticky;top:0;z-index:1000">
    <div class="nav-container">
      <a href="/" class="nav-logo"><span class="logo-icon">⚙</span><span class="logo-text">LOHAR <span class="logo-accent">ADMIN</span></span></a>
      <div style="margin-left:auto;display:flex;gap:12px;align-items:center">
        <span id="adminName" style="color:rgba(255,255,255,0.6);font-size:0.88rem"></span>
        <a href="/" class="btn-outline btn-sm">View Site</a>
        <button onclick="logoutUser()" class="btn-secondary btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="index.html" class="admin-nav-link"><span class="icon">📊</span> Dashboard</a>
      <a href="products.html" class="admin-nav-link"><span class="icon">📦</span> Products</a>
      <a href="orders.html" class="admin-nav-link active"><span class="icon">🛒</span> Orders</a>
      <a href="customers.html" class="admin-nav-link"><span class="icon">👥</span> Customers</a>
      <a href="coupons.html" class="admin-nav-link"><span class="icon">🎫</span> Coupons</a>
      <a href="dealers.html" class="admin-nav-link"><span class="icon">🤝</span> Dealer Inquiries</a>
      <a href="reviews.html" class="admin-nav-link"><span class="icon">⭐</span> Reviews</a>
    </aside>

    <main class="admin-main">
      <div class="admin-page-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <div class="admin-page-title" style="margin-bottom:0">Manage Customer Orders</div>
      </div>

      <div class="glass-card" style="padding:24px; margin-bottom:24px">
        <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:20px">
          <input type="text" id="orderSearchInput" placeholder="Search by Order ID..." style="max-width:250px; margin-bottom:0">
          <select id="statusFilter" onchange="loadOrders()" style="max-width:200px; margin-bottom:0">
            <option value="">All Statuses</option>
            <option value="Placed">Placed</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Packed">Packed</option>
            <option value="Shipped">Shipped</option>
            <option value="Out For Delivery">Out For Delivery</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>

        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Subtotal</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr><td colspan="8" style="text-align:center; color:rgba(255,255,255,0.4)">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Detail Modal -->
      <div id="orderDetailModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:2000; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px)">
        <div class="modal-content glass-card" style="width:650px; max-width:95vw; max-height:90vh; overflow-y:auto; padding:28px; border:1px solid rgba(255,255,255,0.15)">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
            <h3 style="color:#fff; font-family:Outfit; margin:0" id="modalOrderId">Order #XXXX</h3>
            <button onclick="closeModal()" style="background:none; border:none; color:rgba(255,255,255,0.6); font-size:1.8rem; cursor:pointer">&times;</button>
          </div>

          <div id="modalOrderDetailsBody">
            <!-- Dynamic Details -->
          </div>

          <hr style="border:0; border-top:1px solid rgba(255,255,255,0.08); margin:20px 0">

          <!-- Update status panel -->
          <div>
            <h4 style="color:#fff; font-family:Outfit; margin-bottom:12px">Update Order Status</h4>
            <div style="display:flex; gap:12px; align-items:center">
              <select id="modalStatusSelect" style="margin-bottom:0">
                <option value="Placed">Placed</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Packed">Packed</option>
                <option value="Shipped">Shipped</option>
                <option value="Out For Delivery">Out For Delivery</option>
                <option value="Delivered">Delivered</option>
                <option value="Cancelled">Cancelled</option>
              </select>
              <input type="text" id="modalStatusNote" placeholder="Tracking/delivery note (optional)" style="margin-bottom:0; flex:1">
              <button onclick="saveOrderStatus()" class="btn-primary" style="padding:10px 18px">Update</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    let ordersList = [];
    let currentSelectedOrder = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!isLoggedIn()) return window.location.href = '/pages/auth.html?redirect=/pages/admin/orders.html';
      try {
        const { user } = await AuthAPI.me();
        if (user.role !== 'admin') { window.location.href = '/'; return; }
        document.getElementById('adminName').textContent = user.name;
        
        // Listen to search
        document.getElementById('orderSearchInput').addEventListener('input', (e) => {
          clearTimeout(window.searchDebounce);
          window.searchDebounce = setTimeout(() => {
            loadOrders(e.target.value);
          }, 400);
        });

        loadOrders();
      } catch { window.location.href = '/pages/auth.html'; }
    });

    async function loadOrders(search = '') {
      try {
        const status = document.getElementById('statusFilter').value;
        const params = {};
        if (status) params.status = status;
        if (search) params.search = search;

        const res = await AdminAPI.allOrders(params);
        ordersList = res.orders || [];

        const tbody = document.getElementById('ordersTableBody');
        if (ordersList.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:rgba(255,255,255,0.4)">No orders found</td></tr>';
          return;
        }

        tbody.innerHTML = ordersList.map(o => `
          <tr>
            <td><strong style="color:var(--yellow)">${o.orderId}</strong></td>
            <td>${o.user?.name || 'Customer'}<br><small style="color:rgba(255,255,255,0.4)">${o.user?.email || ''}</small></td>
            <td>₹${o.subtotal}</td>
            <td>₹${o.total}</td>
            <td>${o.payment?.method.toUpperCase()}<br><small style="color:${o.payment?.status === 'paid' ? '#10b981' : '#ef4444'}">${o.payment?.status.toUpperCase()}</small></td>
            <td><span class="order-status status-${o.status.toLowerCase().replace(/ /g,'-')}">${o.status}</span></td>
            <td>${new Date(o.createdAt).toLocaleDateString('en-IN')}</td>
            <td><button onclick="viewOrderDetails('${o.orderId}')" class="action-btn action-view">Manage</button></td>
          </tr>
        `).join('');

        // If URL has direct id, open modal
        const urlId = new URLSearchParams(window.location.search).get('id');
        if (urlId && !currentSelectedOrder) {
          viewOrderDetails(urlId);
        }
      } catch (err) { toast.error('Failed to load orders: ' + err.message); }
    }

    async function viewOrderDetails(orderId) {
      currentSelectedOrder = ordersList.find(o => o.orderId === orderId);
      if (!currentSelectedOrder) return;

      document.getElementById('modalOrderId').textContent = `Order #${currentSelectedOrder.orderId}`;
      document.getElementById('modalStatusSelect').value = currentSelectedOrder.status;
      document.getElementById('modalStatusNote').value = '';

      const detailBody = document.getElementById('modalOrderDetailsBody');
      const addr = currentSelectedOrder.shippingAddress;
      
      detailBody.innerHTML = `
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; font-size:0.88rem;">
          <div>
            <h5 style="color:#fff; margin-bottom:6px">Customer & Delivery Details</h5>
            <p style="color:rgba(255,255,255,0.6); line-height:1.4">
              <strong>${addr.fullName}</strong><br>
              Phone: ${addr.phone}<br>
              ${addr.line1}, ${addr.line2 || ''}<br>
              ${addr.city}, ${addr.state} - ${addr.pincode}
            </p>
          </div>
          <div>
            <h5 style="color:#fff; margin-bottom:6px">Billing Summary</h5>
            <p style="color:rgba(255,255,255,0.6); line-height:1.4">
              Subtotal: ₹${currentSelectedOrder.subtotal}<br>
              GST (18%): ₹${currentSelectedOrder.gstAmount}<br>
              Delivery: ₹${currentSelectedOrder.shippingCharge}<br>
              ${currentSelectedOrder.couponDiscount > 0 ? `Coupon: - ₹${currentSelectedOrder.couponDiscount}<br>` : ''}
              <strong>Total: ₹${currentSelectedOrder.total}</strong>
            </p>
          </div>
        </div>

        <h5 style="color:#fff; margin-bottom:10px">Ordered Products</h5>
        <div style="background:rgba(255,255,255,0.02); border-radius:8px; padding:10px 15px; max-height:120px; overflow-y:auto; font-size:0.85rem">
          ${currentSelectedOrder.items.map(item => `
            <div style="display:flex; justify-content:space-between; margin-bottom:6px">
              <span>${item.name} <strong>x${item.qty}</strong></span>
              <span>₹${item.price * item.qty}</span>
            </div>
          `).join('')}
        </div>
      `;

      document.getElementById('orderDetailModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('orderDetailModal').style.display = 'none';
      currentSelectedOrder = null;
    }

    async function saveOrderStatus() {
      if (!currentSelectedOrder) return;
      const status = document.getElementById('modalStatusSelect').value;
      const note = document.getElementById('modalStatusNote').value.trim();

      try {
        await AdminAPI.updateOrderStatus(currentSelectedOrder.orderId, status, note);
        toast.success('Order status updated successfully');
        closeModal();
        loadOrders();
      } catch (err) { toast.error(err.message || 'Failed to update order status'); }
    }
  </script>
</body>
</html>
